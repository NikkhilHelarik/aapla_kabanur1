services:
  - type: web
    name: aapla-kabanur
    runtime: python
    plan: starter          # persistent disks need a paid plan; on free, data resets on every deploy/restart
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DB_PATH
        value: /var/data/aapla_kabanur.db
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
